name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 固定签名密钥（存于仓库 Secrets，不入库）。
      # 没有它的话，GitHub 每次都会新生成一份 debug.keystore，
      # 导致 APK 签名不一致 → 只能卸载重装 → App 数据被清空。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DSH_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.DSH_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$KEYSTORE_PASS"
              echo "keyAlias=dshcollect"
              echo "keyPassword=$KEYSTORE_PASS"
            } > keystore.properties
            echo "signing key restored"
          else
            echo "no signing key in secrets, falling back to ephemeral debug key"
          fi

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
